[package]
name = "cowtype"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A cowsay-compatible speaker with a type mode for asciinema recordings"
license = "MIT"
repository = "https://github.com/briceyan/cowtype"
readme = "README.md"
keywords = ["cowsay", "ascii-art", "terminal", "asciinema"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"
unicode-width = "0.2"

[[bin]]
name = "cowtype"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
